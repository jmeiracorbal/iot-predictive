name: iot-predictive

services:
  iotlink-master:
    build:
      context: ./iotlink/master
    environment:
      PORT: ${IOTLINK_MASTER_PORT}
    ports:
      - "${IOTLINK_BIND_ADDRESS}:${IOTLINK_MASTER_PORT}:${IOTLINK_MASTER_PORT}"
    restart: unless-stopped
    networks: [iotlink]

  iotlink-worker:
    build:
      context: ./iotlink/worker
    depends_on:
      iotlink-master:
        condition: service_healthy
    environment:
      IOTLINK_MASTER_URL: ${IOTLINK_MASTER_URL}
      IOTLINK_GENERATION_INTERVAL_SECONDS: ${IOTLINK_GENERATION_INTERVAL_SECONDS}
      IOTLINK_HTTP_TIMEOUT_SECONDS: ${IOTLINK_HTTP_TIMEOUT_SECONDS}
      IOTLINK_RUN_ONCE: ${IOTLINK_RUN_ONCE}
    restart: unless-stopped
    read_only: true
    networks: [iotlink]

networks:
  iotlink:
    driver: bridge
