name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas unitarias
        run: python -m unittest discover -s iotlink/worker/tests -v
      - name: Validación de Node-RED
        run: python -m json.tool iotlink/master/flows.json > /dev/null
      - name: Validación de Docker Compose
        run: docker compose --env-file .env.example config --quiet
